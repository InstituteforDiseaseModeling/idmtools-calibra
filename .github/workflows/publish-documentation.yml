name: "Rebuild docs"
on:
  release:
    types: # This configuration does not affect the page_build event above
      - created

jobs:
  publish-documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          path: 'itertool'
      - name: Set up Python
        uses: actions/setup-python@v1
        with:
          python-version: '3.7'
      - uses: actions/cache@v1
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('itertool/docs/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        working-directory: 'itertool/docs'
        run: |
          sudo apt-get update
          python -m pip install --upgrade pip py-make
          sudo apt-get install make
          pip install -r requirements.txt
      - name: Install tools in dev mode
        working-directory: 'itertool'
        run: |
          python bootstrap.py
      - name: Build docs
        working-directory: 'itertool/docs'
        run: |
          make html
      - uses: actions/checkout@v2
        with:
          ref: 'gh-pages'
          path: 'gh-pages'
      - name: Copy docs
        run: |
          cp -r itertool/docs/_build/html/* gh-pages/
          ls -al gh-pages/
      - name: Commit docs
        working-directory: 'gh-pages'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add --all .
          git commit -m "${{ github.event.head_commit.message }}"
          eval "$(ssh-agent -s)"
          ssh-add - <<< "${{ secrets.DOCS_DEPLOY_KEY }}"
          git push
      - name: Attach docs to release
        working-directory: 'itertool'
        run: |
          zip -r itertool_docs.zip docs/_build/html
      - name: Upload Docs as Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.release.upload_url }}
          asset_path: { cookiecutter.library_name }}/itertool_docs.zip
          asset_name: itertool_docs.zip
          asset_content_type: application/zip