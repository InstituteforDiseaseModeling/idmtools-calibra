site_name: idmtools_calibra
site_description: Idm calibra tools for disease modeling workflows on HPC clusters
site_url: https://institutefordiseasemodeling.github.io/idmtools_calibra/
site_author: Institute for Disease Modeling
repo_url: https://github.com/InstituteforDiseaseModeling/idmtools_calibra
repo_name: institutefordiseasemodeling/idmtools_calibra

# Configuration
docs_dir: docs
site_dir: site

nav:
  - Home: index.md
  - Install: installation.md
  - Overview: overview.md
  - API Reference:
      - Overview: api/index.md
      - Core: api/idmtools_calibra.md
      - Algorithms: api/algorithms.md
      - Analyzers: api/analyzers.md
      - Plotters: api/plotters.md
      - Output: api/output.md

# Theme
theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Roboto
    code: Roboto Mono

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - toc.follow

  icon:
    repo: fontawesome/brands/github
    logo: material/dna

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
      lang: en

  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
# Markdown Extensions
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      permalink_title: Anchor link to this section

  # PyMdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      auto_title: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

copyright: "Copyright 1999-2026 Gates Foundation. All rights reserved."
# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/institutefordiseasemodeling/idmtools_calibra
      name: idmtools_calibra on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/search/?q=idmtools_calibra
      name: idmtools_calibra on PyPI

  generator: false

# Extra CSS
extra_css:
  - assets/css/extra.css

# Extra JavaScript
extra_javascript:
  - assets/js/extra.js

# Watch
watch:
  - mkdocs.yml
