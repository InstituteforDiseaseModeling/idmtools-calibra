site_name: idmtools_calibra
site_url: https://institutefordiseasemodeling.github.io/idmtools_calibra/
repo_url: https://github.com/InstituteforDiseaseModeling/idmtools_calibra
repo_name: idmtools_calibra
docs_dir: docs

nav:
  - Home: index.md
  - Install: installation.md
  - Overview: overview.md
  - API Reference:
      - Overview: api/index.md
      - Core: api/idmtools_calibra.md
      - Algorithms: api/algorithms.md
      - Analyzers: api/analyzers.md
      - Plotters: api/plotters.md
      - Output: api/output.md

theme:
  name: material
  logo: images/idm-logo-transparent.png
  favicon: images/favicon.ico
  palette:
    scheme: default
    primary: blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
      lang: en

  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
# Markdown Extensions
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      permalink_title: Anchor link to this section

  # PyMdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      auto_title: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

copyright: "Copyright 1999-2025 Gates Foundation. All rights reserved."

extra:
  social:
    - icon: fontawesome/solid/house
      link: https://docs.idmod.org
      name: IDM docs
    - icon: fontawesome/brands/github
      link: https://github.com/institutefordiseasemodeling/idmtools_calibra
      name: GitHub
