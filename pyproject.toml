[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idmtools-calibra"
dynamic = ["version"]
description = "Calibration tool for IDM-Tools"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
keywords = ["modeling", "IDM"]
authors = [
    { name = "Ross Carter",      email = "rcarter@idmod.org" },
    { name = "Sharon Chen",      email = "shchen@idmod.org" },
    { name = "Clinton Collins",  email = "ccollins@idmod.org" },
    { name = "Zhaowei Du",       email = "zdu@idmod.org" },
    { name = "Mary Fisher",      email = "mafisher@idmod.org" },
    { name = "Mandy Izzo",       email = "mizzo@idmod.org" },
    { name = "Clark Kirkman IV", email = "ckirkman@idmod.org" },
    { name = "Benoit Raybaud",   email = "braybaud@idmod.org" },
    { name = "Jen Schripsema",   email = "jschripsema@idmod.org" },
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "fasteners~=0.15",
    "geopy~=2.0",
    "idmtools~=3.0",
    "idmtools_platform_comps~=3.0",
    "idmtools-models~=3.0",
    "scipy~=1.5",
    "seaborn~=0.11",
    "scikit-learn~=1.8",
    "numpy~=2.4",
    "statsmodels~=0.12",
]

[project.optional-dependencies]
dev = ["flake8", "coverage", "bump2version", "twine"]
test = [
    "pytest",
    "pytest-runner",
    "pytest-timeout",
    "pytest-cache",
    "flake8",
    "coverage",
    "bump2version",
    "twine",
]
history-matching = ["history_matching"]

[project.entry-points."idmtools_cli.cli_plugins"]
calibra = "idmtools_calibra.cli.commands:calibra"

[tool.setuptools.dynamic]
version = { attr = "version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
